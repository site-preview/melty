<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>送信完了</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }

    a:hover {
      background: #555;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>送信完了</h1>
  <p>
    お問い合わせありがとうございます!<br>
    内容を確認のうえ、担当者よりご連絡いたします。<br><br>
    通常、2〜3営業日以内に返信させていただきますが、<br>
    しばらく返答のない場合はお手数ですが再送いただけますと幸いです。
  </p>

  <a href="/">トップへ戻る</a>
</div>

</body>
</html>
